name: Build
on:
  [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        arch: [i686, x86_64]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # fix line endings for cygwin bash
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v4

      - uses: cygwin/cygwin-install-action@v5
        with:
          packages: mingw64-${{ matrix.arch }}-gcc-core, cygport, cmake

      - run: echo "$(cat mingw64-${{ matrix.arch }}.cygport | grep RELEASE)" >> $GITHUB_ENV
        name: Export release number

      - run: cygport mingw64-${{ matrix.arch }} download
        name: Download
      - run: cygport mingw64-${{ matrix.arch }} all
        name: Build

      - uses: actions/upload-artifact@v4
        with:
          # avoid matching -src.tar.xz
          path: mingw64-${{ matrix.arch }}-mbedtls-*.noarch/dist/mingw64-${{ matrix.arch }}-mbedtls/*-${{ env.RELEASE }}.tar.xz

  release:
    needs: build
    # if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - name: "Get: all build artifacts"
      uses: actions/download-artifact@v4
