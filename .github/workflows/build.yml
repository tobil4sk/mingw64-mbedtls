name: Build
on:
  [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        arch: [i686, x86_64]
    runs-on: windows-latest
    steps:
      # fix line endings for cygwin bash
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v4

      - uses: cygwin/cygwin-install-action@v5
        with:
          packages: cygport, cmake

      - run: cygport mingw64-${{ matrix.arch }}.cygport download
        name: download
      - run: cygport mingw64-${{ matrix.arch }}.cygport all
        name: build

      - uses: actions/upload-artifact@v4
        with:
          path: mingw64-${{ matrix.arch }}-mbedtls-*.noarch/dist/mingw64-${{ matrix.arch }}-mbedtls/*.tar.xz

  release:
    needs: build
    # if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - name: "Get: all build artifacts"
      uses: actions/download-artifact@v4
